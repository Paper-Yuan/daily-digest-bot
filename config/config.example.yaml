# ============================================================
# 个人聚合早报配置(复制为 config/config.yaml 后修改)
# 密钥一律走环境变量,不写在这里:
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#   FEISHU_WEBHOOK_URL   / FEISHU_SECRET(可选,加签密钥)
#   DINGTALK_WEBHOOK_URL / DINGTALK_SECRET(可选,加签密钥)
#   WECOM_WEBHOOK_URL    (企业微信群机器人,地址里的 key 即凭证)
#   SLACK_WEBHOOK_URL    (Slack Incoming Webhook)
#   QWEATHER_API_KEY(可选,和风天气预警)
#   GITHUB_TOKEN(GitHub Actions 会自动注入,本地可不配)
# ============================================================

timezone: Asia/Shanghai          # "今天"以此时区为准

user:
  name: ""                       # 报告开头的称呼,如 "同学";留空则不称呼

weather:
  enabled: true
  locationName: 北京             # 仅用于展示
  latitude: 39.9042              # Open-Meteo 免费、无需 key
  longitude: 116.4074
  airQuality: true               # 空气质量(PM2.5/PM10 + 等级);同一厂商免费接口,不需要 key
  # 可选:接入和风天气预警(免费订阅 host 用 devapi.qweather.com,付费用 api.qweather.com)
  # qweather:
  #   host: devapi.qweather.com
  #   locationId: "101010100"     # 城市 LocationID,见和风文档

calendar:
  enabled: true
  ics:                           # 日历订阅链接(Google/Apple 日历均可导出 ICS),可为空列表
    - name: 我的日历
      url: ""
  courses:                       # 课表(可选),与 ICS 合并展示
    semesterStart: "2026-09-07"  # 学期第 1 周的周一
    items: []
    # - name: 高等数学
    #   weekday: 1               # 1=周一 ... 7=周日
    #   start: "08:00"
    #   end: "09:40"
    #   location: 教三-101
    #   teacher: 张三
    #   weeks: "1-16"            # 周次,支持 "1,3,5-8";缺省=每周

github:
  enabled: true
  repos:                         # 关注 Release 的仓库,owner/name;不需要就留空列表 []
    - microsoft/TypeScript
    - vuejs/core
  includePrerelease: false
  maxPerRepo: 3
  firstRunQuiet: true            # 首次运行只记录不推送,避免把历史版本全推一遍
  discover:                      # 发现高星新项目(与 repos 可并存,也可只用其中一个)
    enabled: false
    minStars: 100                # star 下限
    createdWithinDays: 7         # 只看最近 N 天创建的仓库
    chineseOnly: true            # 名称/描述含中文才算"中文区"(启发式过滤)
    maxItems: 10
    poolSize: 200                # 参与打分的候选池:按 star 从高到低取前 N 个(上限 1000)
    weights:                     # 榜单加权:star / 提交数 / issue 数
      stars: 0.4                 # 只写 stars: 1 → 退回纯 star 排序(不请求活跃度数据)
      commits: 0.3
      issues: 0.3
    firstRunQuiet: false         # 首次运行直接展示当前榜单

rss:
  enabled: true
  maxPerFeed: 5
  firstRunQuiet: true
  feeds:
    - name: 阮一峰的网络日志
      url: https://www.ruanyifeng.com/blog/atom.xml
    - name: Solidot
      url: https://www.solidot.org/index.rss

baiduhot:
  enabled: true
  maxItems: 10                   # 每次推送当前热搜榜 Top 10,新上榜词条带 🆕

bilibili:
  enabled: false                 # B 站热搜(与百度热搜分开成块)
  maxItems: 10

# 个人向提醒:只在"临近"时才出现在报告里,避免天天刷"还有 300 天"。
personal:
  enabled: false
  anniversaries: []              # 纪念日/生日(每年重复,可配多个)
    # - name: 生日
    #   date: "1998-03-15"       # YYYY-MM-DD
  anniversaryWithinDays: 30      # 距今天数 <= 该值才展示
  certChecks: []                 # 自建域名证书到期探测(留空则不探测)
    # - name: 我的站点
    #   host: example.com
    #   port: 443                # 默认 443
  certWarnDays: 30               # 剩余天数 <= 该值才提醒
  certTimeoutMs: 8000            # 单次 TLS 探测超时

notify:
  # enabled 缺省 = 自动:配了该渠道的环境变量就发送,没配就跳过
  # enabled: true  = 强制启用,缺环境变量按故障处理(任务退出码 1,便于在 CI 里暴露配置遗漏)
  # enabled: false = 关闭该渠道(环境变量齐了也不发)
  # 各渠道并发发送,任一成功即算本次已送达;不收图片的渠道自动只发文本,不算失败。
  telegram:
    enabled: ~                   # TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
  feishu:
    enabled: ~                   # FEISHU_WEBHOOK_URL(+ FEISHU_SECRET 加签)
  dingtalk:
    enabled: ~                   # DINGTALK_WEBHOOK_URL(+ DINGTALK_SECRET 加签)
                                 # 机器人若开"自定义关键词",关键词要出现在标题或正文里
  wecom:
    enabled: ~                   # WECOM_WEBHOOK_URL
  slack:
    enabled: ~                   # SLACK_WEBHOOK_URL

limits:
  maxCalendarEvents: 10
  maxReleases: 8
  maxRssItems: 10
  maxHotItems: 10                # 热搜条数上限
  summaryChars: 100              # Release/RSS 摘要截断长度

# 发布时刻:这里的时刻只在 lockTime=true 时被程序用到。
# 默认(推荐)准点交给 Cloudflare Worker 的 cron(见 cloudflare/ 目录):到点 dispatch
# 触发 Actions,约 35 秒送达。GitHub 自带的 schedule 实测会排队 0~8 小时。
# 不想部署 Worker 时:打开 workflow 里注释掉的 `schedule:` 也能跑,只是到达时间受排队影响。
# lockTime=true 是让程序自己在 runner 上干等到点 —— 必须同时把 workflow 的
# timeout-minutes 调到大于 maxWaitMinutes,否则任务会在等待中被杀掉、当天不再推送。
schedule:
  morning: "08:00"               # 早报目标发布时刻(本地时区)
  evening: "21:00"               # 晚报目标发布时刻
  lockTime: false                # true = 等到目标时刻再发
  maxWaitMinutes: 30             # lockTime=true 时的等待上限,超过则立即发送

# 图片版报告:与文本一同推送。只有 Telegram 收图;飞书/钉钉/企业微信/Slack 的 webhook
# 都传不了本地图片,会自动仅发文本(不报错、不影响该渠道的文本送达)。
# 生成失败(无字体/无网络/库不可用)会自动降级为纯文本,绝不影响推送本身。
image:
  enabled: true
  width: 900                     # 图片宽度(px)
  # fontUrl: ""                  # 可选:自托管中文字体地址(默认用内置 CDN 候选 + 本地缓存)

# 随时快报:手动/API 触发的即时报告。
# 语义是"快照"——展示当下全部内容,但**不写去重状态**,不影响早晚报的增量推送。
quick:
  enabled: true
  limits:                        # 快报条数更精简
    maxHotItems: 5
    maxRssItems: 3
    maxReleases: 3
    maxCalendarEvents: 5
