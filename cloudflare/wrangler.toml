# Cloudflare Worker 配置(wrangler 部署用)
#
# 用后台网页部署的话不需要这个文件,见 README.md 的"方式一"。
# 用命令行部署:wrangler deploy

name = "digest-bot-trigger"
main = "telegram-trigger.js"
compatibility_date = "2026-09-14"

# 非敏感配置放这里;敏感项(TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID /
# GITHUB_TOKEN / WEBHOOK_SECRET)用 `wrangler secret put <名字>` 设置。
[vars]
GITHUB_REPO = "your-github-username/daily-digest-bot"

# Worker 不存任何报告数据,也不需要持久化存储,因此无需 KV / D1 / R2 绑定。
