# 每日早报 + 晚报 + 随时快报:GitHub Actions 定时触发,零服务器成本。
#
# 发布时刻:cron 直接定在目标时刻(不等待)。GitHub 的定时任务是排队执行的,
# 高峰期可能晚几分钟到几十分钟到达,这属于平台行为,本项目不做等待补偿。
#   UTC 00:00 = 北京 08:00 → 早报
#   UTC 13:00 = 北京 21:00 → 晚报
# (若想尽量准点:把下面 cron 各提前 15~20 分钟,并把 config 的 schedule.lockTime 设为 true,
#  程序会等到目标时刻再发 —— 代价是等待期间占用 Actions 分钟数。)
name: 每日早晚报

on:
  schedule:
    - cron: "0 0 * * *"  # 北京 08:00 早报
    - cron: "0 13 * * *" # 北京 21:00 晚报
  workflow_dispatch: # 手动触发:可选模式,支持预览
    inputs:
      mode:
        description: "报告类型"
        type: choice
        options: [auto, quick, morning, evening]
        default: auto
      dryRun:
        description: "仅预览,不推送、不写状态"
        type: boolean
        default: false
      force:
        description: "忽略去重状态与发布锁,强制重发"
        type: boolean
        default: false
  # 外部按需触发(手机快捷指令 / 自动化):POST /repos/{owner}/{repo}/dispatches
  #   body: {"event_type": "quick-report"}
  repository_dispatch:
    types: [quick-report]

# 去重状态经 actions/cache 传递,仓库本身只需读权限
permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # 去重状态 + 中文字体缓存(字体约 1.1MB,缓存后无需每次重新下载)
      - name: 恢复状态与字体缓存
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/fonts
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - run: npm ci

      - name: 生成并发送报告
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }} # 提升 GitHub API 限额(60→5000 次/小时)
        run: |
          FLAGS=""

          # 仅"定时触发"启用发布锁(等待到点 + 当日幂等);手动触发立即发送
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            FLAGS="$FLAGS --scheduled"
          fi

          # 快报:repository_dispatch 事件,或手动选择 mode=quick
          MODE="${{ inputs.mode }}"
          if [[ "${{ github.event_name }}" == "repository_dispatch" || "$MODE" == "quick" ]]; then
            FLAGS="$FLAGS --quick"
          fi
          if [[ "$MODE" == "morning" || "$MODE" == "evening" ]]; then
            FLAGS="$FLAGS --kind=$MODE"
          fi

          if [[ "${{ inputs.force }}" == "true" ]]; then FLAGS="$FLAGS --force"; fi
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then FLAGS="$FLAGS --dry-run --force"; fi

          echo "运行参数: $FLAGS"
          npm run morning -- $FLAGS
